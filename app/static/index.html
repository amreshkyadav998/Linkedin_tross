<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LinkedIn Profile API</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #14161a;
    --muted: #616a76;
    --line: #dfe3e8;
    --accent: #0a66c2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #171b21; --ink: #e8eaed;
      --muted: #9aa4b1; --line: #2a3038; --accent: #4f9bec;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p.sub { color: var(--muted); margin: 0 0 1.5rem; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 1.25rem;
  }
  form { display: flex; gap: .5rem; flex-wrap: wrap; }
  input[type=text] {
    flex: 1 1 320px; padding: .6rem .75rem; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink);
  }
  button {
    padding: .6rem 1.1rem; font-size: 1rem; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 6px; background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .6; cursor: progress; }
  .opts { margin-top: .75rem; color: var(--muted); font-size: .85rem; }
  .opts label { margin-right: 1rem; }
  pre {
    margin-top: 1rem; padding: 1rem; overflow-x: auto; max-height: 65vh;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    font-size: 12.5px; white-space: pre-wrap; word-break: break-word;
  }
  a { color: var(--accent); }
  footer { margin-top: 1.25rem; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>LinkedIn Profile API</h1>
  <p class="sub">Paste a profile URL and get structured JSON back.</p>

  <div class="card">
    <form id="f">
      <input id="url" type="text" placeholder="https://www.linkedin.com/in/williamhgates/" required />
      <button id="go" type="submit">Fetch</button>
    </form>
    <div class="opts">
      <label><input type="checkbox" id="contact" /> contact info (retired by LinkedIn)</label>
      <label><input type="checkbox" id="refresh" /> skip cache</label>
      <label><input type="checkbox" id="raw" /> raw payload</label>
    </div>
    <pre id="out">Results will appear here.</pre>
  </div>

  <footer>
    <a href="/docs">OpenAPI docs</a> &middot;
    <a href="/health">health</a>
  </footer>
</main>

<script>
  const form = document.getElementById('f');
  const out = document.getElementById('out');
  const go = document.getElementById('go');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const params = new URLSearchParams({
      url: document.getElementById('url').value.trim(),
      include_contact: document.getElementById('contact').checked,
      refresh: document.getElementById('refresh').checked,
      raw: document.getElementById('raw').checked,
    });

    go.disabled = true;
    out.textContent = 'Fetching...';
    try {
      const res = await fetch('/api/v1/profile?' + params.toString());
      const body = await res.json();
      out.textContent = res.status + ' ' + res.statusText + '\n\n'
        + JSON.stringify(body, null, 2);
    } catch (err) {
      out.textContent = 'Request failed: ' + err;
    } finally {
      go.disabled = false;
    }
  });
</script>
</body>
</html>
